<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
			background: #f5f7fb;
            min-height: 100vh;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #1e1b4b;
        }
        .logo i { color: #4c1d95; margin-right: 8px; }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4c1d95;
            box-shadow: 0 0 0 3px rgba(76,29,149,0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(76,29,149,0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-card">
                    <div class="text-center mb-4">
                        <div class="logo">
                            <i class="fas fa-graduation-cap"></i> EduTrack
                        </div>
                        <p class="text-muted mt-2">Espace Administration</p>
                    </div>
                    <form th:action="@{/admin/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="fas fa-user me-2"></i>Nom d'utilisateur</label>
                            <input type="text" name="username" class="form-control" placeholder="admin" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold"><i class="fas fa-lock me-2"></i>Mot de passe</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Se connecter</button>
                    </form>
                    <div class="text-center mt-4">
                        <small class="text-muted"><i class="fas fa-info-circle me-1"></i>@ Mufungizi Merite</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
