<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un résultat - EduTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
			background: #f5f7fb; 
            min-height: 100vh;
            padding: 2rem;
        }
        .form-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #1e1b4b;
        }
        .logo i { color: #4c1d95; margin-right: 8px; }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4c1d95;
            box-shadow: 0 0 0 3px rgba(76,29,149,0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(76,29,149,0.3);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #4c1d95;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-card">
                    <div class="text-center mb-4">
                        <div class="logo">
                            <i class="fas fa-graduation-cap"></i> EduTrack
                        </div>
                        <p class="text-muted mt-2">Ajouter un résultat semestriel</p>
                    </div>
                    
                    <form th:action="@{/admin/resultats/add/{palmaresId}(palmaresId=${palmaresId})}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="fas fa-book-open me-2"></i>Semestre</label>
                            <select name="semestreId" class="form-select" required>
                                <option th:each="s : ${semestres}" th:value="${s.id}" th:text="'Semestre ' + ${s.numero} + ' - ' + ${s.anneeAcademique?.libelle}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="fas fa-chart-simple me-2"></i>Note /20</label>
                            <input type="number" step="0.01" min="0" max="20" name="note" class="form-control" placeholder="Ex: 14.5" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold"><i class="fas fa-medal me-2"></i>Mention</label>
                            <select name="mention" class="form-select" required>
                                <option value="P">Passable (P)</option>
                                <option value="AB">Assez bien (AB)</option>
                                <option value="B">Bien (B)</option>
                                <option value="TB">Très bien (TB)</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1"><i class="fas fa-save me-2"></i>Enregistrer</button>
                            <a href="javascript:history.back()" class="btn btn-secondary flex-grow-1"><i class="fas fa-arrow-left me-2"></i>Annuler</a>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
