<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un étudiant - EduTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
			background: #f5f7fb;
            min-height: 100vh;
            padding: 2rem;
        }
        .form-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #1e1b4b;
        }
        .logo i { color: #4c1d95; margin-right: 8px; }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4c1d95;
            box-shadow: 0 0 0 3px rgba(76,29,149,0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(76,29,149,0.3);
        }
        .btn-danger {
            background: #dc2626;
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-danger:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #4c1d95;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        .parcours-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }
        .table-custom {
            margin-top: 1rem;
        }
        .table-custom th {
            background: #f8fafc;
            padding: 12px;
            font-weight: 600;
        }
        .table-custom td {
            padding: 12px;
            vertical-align: middle;
        }
        .badge-mention {
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }
    </style>
</head>
<body class="d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="form-card">
                    <div class="text-center mb-4">
                        <div class="logo">
                            <i class="fas fa-graduation-cap"></i> EduTrack
                        </div>
                        <p class="text-muted mt-2">Modifier les informations de l'étudiant</p>
                    </div>
                    
                    <!-- Formulaire modification -->
                    <form th:action="@{/admin/etudiants/edit/{id}(id=${etudiant.id})}" th:object="${etudiant}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold"><i class="fas fa-user me-2"></i>Nom</label>
                                <input type="text" th:field="*{nom}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold"><i class="fas fa-user me-2"></i>Prénom</label>
                                <input type="text" th:field="*{prenom}" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold"><i class="fas fa-id-card me-2"></i>Matricule</label>
                                <input type="text" th:field="*{matricule}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-semibold"><i class="fas fa-calendar-alt me-2"></i>Date naissance</label>
                                <input type="date" th:field="*{dateNaissance}" class="form-control">
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1"><i class="fas fa-save me-2"></i>Enregistrer</button>
                            <a href="/admin/etudiants" class="btn btn-secondary flex-grow-1"><i class="fas fa-arrow-left me-2"></i>Retour</a>
                        </div>
                    </form>
                    
                    <div class="parcours-section">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Parcours académiques</h5>
                            <a th:href="'/admin/parcours/add/' + ${etudiant.id}" class="btn btn-primary btn-sm">
                                <i class="fas fa-plus me-1"></i>Ajouter un parcours
                            </a>
                        </div>
                        
                        <div th:if="${parcoursList != null and !parcoursList.empty}">
                            <table class="table table-custom">
                                <thead>
                                    <tr><th>Promotion</th><th>Date inscription</th><th>Moyenne</th><th>Mention</th><th>Actions</th></tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${parcoursList}">
                                        <td th:text="${p.promotion?.nom}">-</td>
                                        <td th:text="${p.dateInscription}">-</td>
                                        <td th:text="${p.moyenneGenerale}">-</td>
                                        <td><span class="badge-mention" th:text="${p.mention}">-</span></td>
                                        <td>
                                            <a th:href="'/admin/resultats/add/' + ${p.id}" class="btn btn-sm btn-outline-success me-1" title="Ajouter note">
                                                <i class="fas fa-plus"></i>
                                            </a>
                                            <a th:href="'/admin/parcours/delete/' + ${p.id}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer ce parcours ?')" title="Supprimer">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:unless="${parcoursList != null and !parcoursList.empty}" class="alert alert-info mb-0">
                            <i class="fas fa-info-circle me-2"></i>Aucun parcours enregistré pour cet étudiant.
                        </div>
                    </div>
                    
                    <div class="text-center mt-4">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
